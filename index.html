<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel System</title>
    <meta name="description" content="First-party visitor identification and network intelligence system." />
    <meta property="og:title" content="Intel System" />
    <meta property="og:description" content="First-party visitor identification and network intelligence system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F172A'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='%23F05A28' text-anchor='middle'%3EI%3C/text%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0F172A" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('intel_theme');
          var prefersDark =
            !stored && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || prefersDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
