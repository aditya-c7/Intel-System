name: Test suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Meta-check (every test* script is wired into CI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:meta

  unit:
    name: Unit (test:unit aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Integration (test:integration aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the dashboard the browser harnesses drive
        run: npm run build
      - name: Run worker + browser harnesses (browser suites SKIP explicitly when no Chromium)
        run: npm run test:integration
      - name: Shadow diagnostics (test:diag / test:proxy / test:vpn via test:shadow)
        run: npm run test:shadow
