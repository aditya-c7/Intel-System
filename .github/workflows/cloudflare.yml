name: Verify Cloudflare backend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node scripts/build-worker.mjs
      - run: npx --yes wrangler@4.161.0 deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/test-worker.mjs
