name: Verify Cloudflare backend
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pin headless Chrome — early, must succeed
        run: |
          test -x "$CHROMIUM_PATH"
          "$CHROMIUM_PATH" --headless --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null
      - run: npm run lint
      - run: npm run build
      - run: node scripts/build-worker.mjs
      - name: Generated bundles reproduce from source (read-only drift guard)
        run: |
          if ! git diff --exit-code HEAD -- api/index.js; then
            echo "api/index.js is stale vs 'npm run build': regenerate and commit only api/index.js."
            exit 1
          fi
          cp build/worker/index.js "$RUNNER_TEMP/worker-index.baseline.js"
          node scripts/build-worker.mjs
          if ! cmp -s "$RUNNER_TEMP/worker-index.baseline.js" build/worker/index.js; then
            echo "build/worker/index.js is stale/non-reproducible vs 'node scripts/build-worker.mjs'."
            exit 1
          fi
      - run: npx --yes wrangler@4.161.0 deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/test-worker.mjs
      - name: "Run the full aggregate suite (strict browser mode: a browser SKIP fails CI)"
        run: npm run test:all
