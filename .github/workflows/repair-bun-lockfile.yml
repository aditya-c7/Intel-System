name: Verify Bun lockfile (PR only)

on:
  pull_request:
    paths:
      - bun.lock
      - package.json
      - .github/workflows/repair-bun-lockfile.yml
  workflow_dispatch:

# Read-only by design: contributors regenerate the lockfile locally and commit it.
# This job never writes to the repository and never targets main with a write.
permissions:
  contents: read

jobs:
  verify:
    name: Lockfile in sync (read-only verification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify frozen installation
        run: bun install --frozen-lockfile
      - name: Fail if regeneration would change the lockfile
        run: |
          bun install --lockfile-only
          if ! git diff --quiet -- bun.lock; then
            echo "bun.lock is out of sync. Run 'bun install --lockfile-only' locally and commit the result."
            git diff -- bun.lock
            exit 1
          fi
      - name: Check build
        run: bun run build
      - name: Check types
        run: bun run lint
